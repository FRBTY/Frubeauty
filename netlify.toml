[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Hoszt-kanonizálás: www → csupasz domain (apex), 301-gyel, force=true.
# A GSC-ben a www.frubeauty.com külön oldalként jelent meg → megosztott
# entitás-/link-jelek. Ez a szabály a kanonikus apex-re tereli a www-t (a path
# megmarad: :splat). ELSŐ a redirect-listában (first match wins), így a www-s
# kérés egy hoppal a végleges, slashes apex-URL-re ér.
# Megjegyzés: ha a Netlify "primary domain" beállítás már apex-re terel, ez
# redundáns, de ártalmatlan biztosíték — és verzióban követhető (IaC).
[[redirects]]
  from = "https://www.frubeauty.com/*"
  to = "https://frubeauty.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# 301 átirányítások: a RÉGI Wix-oldal még indexelt URL-jei → az új megfelelő oldalak.
# A GSC-ben ezek 404-re futottak (a /book-online még pozíció 2,7-en is megjelent),
# így a maradék rangsor/forgalom elveszett. A konkrét szabályok ELŐBB, a /service-page
# gyűjtő (*) UTOLJÁRA — a Netlify az első találatot alkalmazza (first match wins).
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/book-online"
  to = "/"
  status = 301

[[redirects]]
  from = "/service-page/szempillafestés"
  to = "/szempilla-lifting-zuglo/"
  status = 301

[[redirects]]
  from = "/service-page/szemöldökformázás-festéssel-laminálással"
  to = "/szemoldok-laminalas-zuglo/"
  status = 301

# A /service-page régi Wix-prefix hosszú farka (minden egyéb szolgáltatás-oldal) → kezdőlap.
[[redirects]]
  from = "/service-page/*"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self'; frame-src https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
