# Ismeretlen Wix-időpontfoglalás → kezdőlap (ott van a foglalás CTA).
[[redirects]]
  from = "/booking-calendar/*"
  to = "/"
  status = 301

# --- Wix portfólió (/portfolio-collections/..., /my-portfolio/...) → smink money page ---
[[redirects]]
  from = "/portfolio-collections/*"
  to = "/sminkes-zuglo/"
  status = 301
[[redirects]]
  from = "/my-portfolio/*"
  to = "/sminkes-zuglo/"
  status = 301
[[redirects]]
  from = "/my-portfolio"
  to = "/sminkes-zuglo/"
  status = 301

# --- Wix placeholder/teszt oldalak és a régi RSS → kezdőlap, illetve blog ---
[[redirects]]
  from = "/blank"
  to = "/"
  status = 301
[[redirects]]
  from = "/blank-1"
  to = "/"
  status = 301
[[redirects]]
  from = "/blank-2"
  to = "/"
  status = 301
[[redirects]]
  from = "/blank-3"
  to = "/"
  status = 301
[[redirects]]
  from = "/testpage"
  to = "/"
  status = 301
[[redirects]]
  from = "/blog-feed.xml"
  to = "/blog/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
