[[redirects]]
  from = "/booking-calendar/szem%C3%B6ld%C3%B6k-lamin%C3%A1l%C3%A1s-szempilla-lifting"
  to = "/szemoldok-laminalas-zuglo/"
  status = 301
[[redirects]]
  from = "/booking-calendar/szemöldök-laminálás-szempilla-lifting"
  to = "/szemoldok-laminalas-zuglo/"
  status = 301

[[redirects]]
