[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Hoszt-kanonizálás: www → csupasz domain (apex), 301-gyel, force=true.
# A GSC-ben a www.frubeauty.com külön oldalként jelent meg → megosztott
# entitás-/link-jelek. Ez a szabály a kanonikus apex-re tereli a www-t (a path
# megmarad: :splat). ELSŐ a redirect-listában (first match wins), így a www-s
# kérés egy hoppal a végleges, slashes apex-URL-re ér.
# Megjegyzés: ha a Netlify "primary domain" beállítás már apex-re terel, ez
# redundáns, de ártalmatlan biztosíték — és verzióban követhető (IaC).
[[redirects]]
  from = "http://www.frubeauty.com/*"
  to = "https://frubeauty.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.frubeauty.com/*"
  to = "https://frubeauty.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# 301 átirányítások: a RÉGI Wix-oldal még indexelt URL-jei → az új megfelelő oldalak.
# A GSC-ben ezek a Wix-URL-ek MÉG INDEXELTEK (www.frubeauty.com/service-page/...),
# így a rangsor/authority-jük a megfelelő money page-re terelendő.
#
# FONTOS (2026-06-24 audit): a Googlebot a kérést PERCENT-KÓDOLVA küldi
# (szempillafest%C3%A9s), a Netlify pedig a kódolt útra illeszt. Ezért az ékezetes
# LITERÁL `from` szabályok SOHA nem tüzeltek → minden /service-page a gyűjtővel a
# főoldalra esett (curl-lel verifikálva). Megoldás: az ENCODED `from` az elsődleges
# (ez egyezik a bejövő úttal); a literál alatta marad ártalmatlan fallbacknek.
# A konkrét szabályok ELŐBB, a /service-page gyűjtő (*) UTOLJÁRA (first match wins).
# Deploy után KÖTELEZŐ curl-ellenőrzés, hogy a money page-re visz, nem a főoldalra.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/book-online"
  to = "/"
  status = 301

# A statikus index.html változatok közvetlenül a végleges, záró perjeles URL-re mennek.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/blog/:slug/index.html"
  to = "/blog/:slug/"
  status = 301
[[redirects]]
  from = "/:path/index.html"
  to = "/:path/"
  status = 301

# --- Szempilla festés (Wix) → szempilla lifting money page ---
[[redirects]]
  from = "/service-page/szempillafest%C3%A9s"
  to = "/szempilla-lifting-zuglo/"
  status = 301
[[redirects]]
  from = "/service-page/szempillafestés"
  to = "/szempilla-lifting-zuglo/"
  status = 301

# --- Szemöldök formázás+festés+laminálás (Wix) → szemöldök laminálás money page ---
[[redirects]]
  from = "/service-page/szem%C3%B6ld%C3%B6kform%C3%A1z%C3%A1s-fest%C3%A9ssel-lamin%C3%A1l%C3%A1ssal"
  to = "/szemoldok-laminalas-zuglo/"
  status = 301
[[redirects]]
  from = "/service-page/szemöldökformázás-festéssel-laminálással"
  to = "/szemoldok-laminalas-zuglo/"
  status = 301

# --- Szemöldök formázás és festés (Wix, külön indexelt slug) → szemöldök laminálás money page ---
[[redirects]]
  from = "/service-page/szem%C3%B6ld%C3%B6k-form%C3%A1z%C3%A1s-%C3%A9s-fest%C3%A9s"
  to = "/szemoldok-laminalas-zuglo/"
  status = 301
[[redirects]]
  from = "/service-page/szemöldök-formázás-és-festés"
  to = "/szemoldok-laminalas-zuglo/"
  status = 301

# Nincs /service-page/* catch-all: csak a fenti, bizonyított legacy URL-ek
# irányítódnak át. Az ismeretlen régi slugok valódi 404-et kapnak.


# ---------------------------------------------------------------------------
# 2026-08-21 Ahrefs-audit: a Wix-kori URL-ek MÉG MINDIG 404-eznek (20 db a
# Site Explorer "Crawled pages" listáján, a legfrissebb crawl 2 napos). A
# korábbi javítás csak a /service-page/* mintát fedte le; a /post/*,
# /booking-calendar/*, /portfolio-collections/*, /my-portfolio/* és a
# Wix-placeholderek kimaradtak.
#
# Linkerő nem vész el (mind UR 0), a tét a régi Google-találatból érkező
# vendég és a crawl-zaj.
#
# Az ENCODED `from` az elsődleges (a Googlebot percent-kódolva kér, és a
# Netlify a kódolt útra illeszt) — a literál ékezetes változat alatta marad
# ártalmatlan fallbacknek. A slug-szintű szabályok ELŐBB, a mappa-szintű
# gyűjtő (*) UTOLJÁRA: first match wins.
# ---------------------------------------------------------------------------

# --- Wix blogposztok (/post/...) → a megfelelő money page ---
[[redirects]]
  from = "/post/alak%C3%ADtsa-%C3%A1t-megjelen%C3%A9s%C3%A9t-fot%C3%B3z%C3%A1shoz-k%C3%A9sz%C3%BClt-profi-smink-seg%C3%ADts%C3%A9g%C3%A9vel"
  to = "/sminkes-zuglo/"
  status = 301
[[redirects]]
  from = "/post/alakítsa-át-megjelenését-fotózáshoz-készült-profi-smink-segítségével"
  to = "/sminkes-zuglo/"
  status = 301

[[redirects]]
  from = "/post/esk%C3%BCv%C5%91i-smink-budapesten-tal%C3%A1lja-meg-a-t%C3%B6k%C3%A9letes-budapesti-esk%C3%BCv%C5%91i-smink-szakembert"
  to = "/sminkes-zuglo/"
  status = 301
[[redirects]]
  from = "/post/esküvői-smink-budapesten-találja-meg-a-tökéletes-budapesti-esküvői-smink-szakembert"
  to = "/sminkes-zuglo/"
  status = 301

# Ismeretlen Wix-blogposzt → a blog főoldala (ne a kezdőlap: a szándék olvasás).
[[redirects]]
  from = "/post/*"
  to = "/blog/"
  status = 301

