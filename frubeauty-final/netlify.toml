  to = "/szemoldok-laminalas-zuglo/"
  status = 301
[[redirects]]
  from = "/booking-calendar/szemöldökformázás-festéssel-laminálással"
  to = "/szemoldok-laminalas-zuglo/"
  status = 301

[[redirects]]
  from = "/booking-calendar/esk%C3%BCv%C5%91i-pr%C3%B3basmink"
  to = "/sminkes-zuglo/"
  status = 301
[[redirects]]
